name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need (A5.1 item 6).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Per-ref concurrency: PRs/branches cancel their own stale runs; deploys serialize separately (on `pages`).
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    env:
      # CI-local test credentials — the stack is an EPHEMERAL local Supabase, so these are not secrets.
      E10_ADMIN_EMAIL: e10adm@example.com
      E10_ADMIN_PW: CiLocal!23456
      E10_MEMBER_EMAIL: e10mem@example.com
      E10_MEMBER_PW: CiLocal!23456
      E10_GATE_EMAIL: e10gate@example.com
      E10_GATE_PW: CiLocal!23456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # supabase-js 2.110+ needs a native WebSocket (Node 22+)
      - name: Install test deps
        working-directory: tests
        run: npm ci   # lockfile-exact, reproducible
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1   # pinned to the tested CLI version (not `latest`)
      - name: Start local Supabase (proves A1 reproducibility on a clean stack)
        run: supabase start
      - name: Provision local test users
        run: node tests/provision_local_users.js
      - name: Pure-helper suites
        run: |
          node tests/genname_test.js
          node tests/idemkey_test.js
          node tests/merge_test.js
          node tests/schema_gate_test.js   # the "gate bites" comparator proof (fail-closed on mismatch/error/null)
      - name: Local integration + RLS-adversarial suites
        run: |
          node tests/m31_test.js
          node tests/m32_test.js
          node tests/genname_persist_test.js
          # rls_test = the roles/permissions engine (admin/member/viewer isolation, INSERT...RETURNING,
          # onboarding-RPC gating). Its 3 fixtures + argv ids come from provision_rls_users.js (stdout = the
          # ids; logs go to stderr). No e10_role_permissions seed needed — the empty table is a deny-list
          # (all caps allowed), matching production exactly.
          RLS_IDS=$(node tests/provision_rls_users.js)
          node tests/rls_test.js $RLS_IDS
      - name: Browser suites (headless)
        run: |
          node tests/picker_test.js
          node tests/genname_ui_test.js
          node tests/m32_ui_test.js
          node tests/live_flow_test.js
          node tests/m4_realtime_test.js
      - name: A6a.1 org-core tests (handle-verify race + module_bundle)
        # Runs while the provisioned members still exist (before the db reset below), so the verify-race cases
        # (which need a platform-admin identity) execute rather than skip.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6a1_verify_bundle_test.sql
      - name: A6a.2 effective module-access tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6a2_module_access_test.sql
      - name: A6a.3 concurrent verify-vs-reject (two connections)
        # Genuine two-connection race: A holds the handle advisory lock, B's verify blocks on it, A commits a
        # lockless reject, B unblocks and must fail. Needs the provisioned members (runs before the db reset below).
        run: node tests/a6a3_verify_concurrent_test.js
      - name: A6b Step 1 invalid concurrent-index recovery proof
        # Fabricates a real INVALID allowlisted index + a non-allowlisted invalid index, runs the actual recovery
        # script, and asserts: allowlisted invalid dropped, unknown refused, rebuild valid (indisvalid=true).
        run: bash tests/a6b_reindex_recovery_test.sh
      - name: A6b composite-FK ON DELETE corrective proof (delete survives ledger; cross-org rejected)
        # Drives the real inventory RPCs: e10_inv_delete_item succeeds; its correction movement+receipt survive the
        # item deletion (org+item_id retained); the reservation cascades; a cross-org ledger insert is rejected.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6b_fk_corrective_test.sql
      - name: A6c.0 prerequisites gate (delegate ACL allowlist, spectate, per-delegate positive+adversarial authz)
        # Proves the exact authenticated allowlist (13 client delegates; internals service_role-only; zero anon/PUBLIC),
        # the published spectator predicate, and per-delegate authorization (cross-org / missing-cap / non-owner / invalid-code denied).
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c0_gate_test.sql
      - name: A6c.1 RLS rewrite gate (8-axis adversarial under authenticated JWT + deleted-item ledger visibility)
        # Under `set role authenticated` (RLS enforced): cross-org, non-member, participant, viewer-vs-member,
        # buyer_uid, handle, published-vs-private axes each positive+denial; deleted item's ledger row stays readable; cross-org write denied.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c1_rls_test.sql
      - name: A6c.2 wrapper-cutover gate (relocated delegates enforce org boundaries; legacy wrappers forward via current_org)
        # Proves the relocated e10_org_* delegates ARE the mechanism: cross-org Entity mutation, missing-capability, and
        # multi-membership fail-closed (through a legacy-wrapper cutover path) each denied with the specific 42501; the
        # relocated delete path keeps the deleted item's correction movement readable; buyer_suggest non-owner denied; redeem-null.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c2_cutover_test.sql
      - name: A6c.2.1 authority-corrective gate (org-scoped admin; no legacy global-admin power in a foreign org; buyer_suggest session-scoped)
        # A legacy global admin (e10_members.role='admin') who is an ORDINARY member of org B gets ordinary-member behavior
        # there across release/mark_sold/consume/set_reservations/reverse (org-B admin retains it); buyer_suggest's `seen`
        # is scoped to the requested session, so no same-owner-other-session or cross-org buyer identities leak.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c2_1_authority_test.sql
      - name: A6c.3 workspace policy + CAS gate (org-scoped workspace RLS; optimistic-concurrency CAS; global-PK invariant)
        # The 4 rewritten e10_workspace policies enforce the org boundary: an org0 member reads + CAS-bumps (org0,'shared')
        # and a stale-rev CAS matches 0 rows (merge signal); an org-B-only member is denied read and write; an org-B
        # 'shared' INSERT fails the retained global PRIMARY KEY(id) with 23505; a cross-org re-stamp is refused 42501.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c3_workspace_test.sql
      - name: A6c.4 platform/identity gate (catalog SELECT platform/org-scoped; 15 mutations deny-by-default; identity org-scoped)
        # The 5 platform-catalog SELECTs read for an org member or platform admin (no-org denied); the 15 catalog mutation
        # policies are dropped so an authenticated INSERT is refused 42501 (deny-by-default under enabled RLS); members/
        # role_permissions/viewers are org-scoped with e10.is_org_admin(e10.current_org()) writes.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c4_platform_identity_test.sql
      - name: A6c.4 workspace disclosures (carried A6c.3 branches — ws_del, missing-cap, multi-membership, universal/owner)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a6c4_disclosures_test.sql
      - name: A6c.4 two-connection workspace CAS race (concurrent optimistic-concurrency proof)
        run: bash tests/a6c4_cas_race.sh
      - name: A7 hostile two-org matrix (every identity class x both orgs x every census family, real JWTs, specific refusals)
        # docs/A7_HOSTILE_MATRIX.md proven: F1-F8 cross-org denials + legitimate positives under real authenticated JWTs;
        # ledger outlives items under a hostile identity; receipts server-only (no authenticated grant); anon zero access;
        # delegate authority census 0. Proofs only — a gap would be a FINDING, not an in-gate fix.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/a7_hostile_matrix_test.sql
      - name: STEP8 bounded-reads gate (keyset pagination, server-side filters, retired e10_inv_list, bounded history)
        # e10_inv_list/e10_org_inv_list RETIRED; e10_org_inv_page keyset-paginates with no skip/dup + server-side filters
        # + clamped limit + cross-org 42501; e10_org_inv_history org-scoped, newest-first, reads a hard-deleted item's
        # movement (ledger outlives items, no FK); the 55 A6c.1 policy predicates + mutation delegate bodies untouched.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/step8_bounded_reads_test.sql
      - name: TA-X1 identity foundation (tenant products, release variants, physical copies, provider mappings)
        # Proves org isolation, Cards-off generic items, release-variant versus copy serial separation,
        # multi-subject cards, revisioned provider mappings, active-version barcode reuse, and physical
        # identity survival after the linked legacy inventory row is deleted.
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x1_identity_foundation_test.sql
      - name: TA-X2 location and supplier foundation (authorized destinations, offerings, hostile tenant boundary)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x2_location_supplier_test.sql
      - name: TA-X3a purchasing documents (separate objects, allocations, comments, source dedup)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x3a_purchasing_documents_test.sql
      - name: TA-X3b immutable commercial-document revisions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x3b_document_revisions_test.sql
      - name: TA-X4a lot and reservation foundation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x4a_lot_reservation_foundation_test.sql
      - name: TA-X4b atomic lot reservation writer
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x4b_lot_reserve_test.sql
          node tests/ta_x4b_lot_reserve_concurrent_test.js
      - name: TA-X4c lot reservation consume and release
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x4c_lot_transition_test.sql
      - name: TA-X4d receipt posting and reversal
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x4d_receipt_posting_test.sql
          node tests/ta_x4d_receipt_reverse_concurrent_test.js
      - name: TA-X5a typed intake and lifecycle foundation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x5a_typed_intake_lifecycle_test.sql
      - name: TA-X5b bounded intake and lifecycle writers
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/ta_x5b_intake_lifecycle_writers_test.sql
          node tests/ta_x5b_writers_concurrent_test.js
      - name: Schema reproducibility (re-apply migrations cleanly)
        run: supabase db reset
      - name: Default-privileges regression probe (born-locked; zero anon-executable functions)
        # Guards the A5.1a invariant against regression on every push (psql ships on ubuntu-latest runners).
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/probe_defpriv.sql

  # Live PRODUCTION contract gate — runs on main ONLY, before deploy, and GATES it. Proves the to-be-deployed
  # client's SCHEMA_VERSION matches live e10_schema_version(). Uses the protected `production` environment's
  # least-privilege gate account (no org membership). Proves CONTRACT compatibility, NOT migration completeness.
  schema-gate:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test deps
        working-directory: tests
        run: npm ci
      - name: Live production schema gate (blocks deploy on client/DB contract mismatch)
        env:
          E10_ALLOW_PROD: "1"
          E10_ANON: ${{ secrets.E10_ANON }}
          E10_SCHEMA_GATE_EMAIL: ${{ secrets.E10_SCHEMA_GATE_EMAIL }}
          E10_SCHEMA_GATE_PW: ${{ secrets.E10_SCHEMA_GATE_PW }}
        run: node tests/schema_gate_live.js

  deploy:
    needs: [test, schema-gate]   # BOTH the test job and the live schema gate must pass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage WEB ASSETS ONLY (never tests/, supabase/, docs/, .github/)
        run: |
          mkdir -p dist
          cp index.html open.html overlay.html companion.html .nojekyll dist/
          echo "Published files:" && ls -la dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
